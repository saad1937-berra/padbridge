# Internal PR artifact only. NEVER publishes a release or installs a driver.
name: PadBridge Windows NSIS Diagnostic Preview (not a release)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-diagnostic-preview.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'policy/**'
      - 'scripts/check_diagnostic_preview.py'
      - 'scripts/check_public_distribution.py'
      - 'scripts/check_xinput_provider.py'
      - 'docs/DIAGNOSTIC_WINDOWS_PREVIEW.md'

permissions:
  contents: read

concurrency:
  group: padbridge-nsis-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-diagnostic-only:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js for Tauri
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: diagnostic-nsis-x64

      - name: Reject public release and all unapproved virtual drivers
        shell: pwsh
        run: |
          python scripts/check_public_distribution.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Public-free release policy violated" }
          python scripts/check_xinput_provider.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Virtual XInput provider was not approved" }
          python scripts/check_diagnostic_preview.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "NSIS diagnostic package policy violated" }

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build unsigned per-user diagnostic NSIS package
        shell: pwsh
        run: |
          npm run tauri build -- --ci --bundles nsis --config src-tauri/tauri.diagnostic.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri diagnostic NSIS build failed" }

      - name: Verify artifact contains no installer-sidecar driver packages
        shell: pwsh
        run: |
          $root = 'src-tauri/target/release/bundle'
          $folder = Join-Path $root 'nsis'
          if (-not (Test-Path -LiteralPath $folder -PathType Container)) {
            throw "NSIS output directory was not created"
          }
          $setups = @(Get-ChildItem -LiteralPath $folder -File -Filter '*.exe')
          if ($setups.Count -ne 1) { throw "Expected exactly one NSIS installer, got $($setups.Count)" }
          $unsafe = @(Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $_.Extension.ToLowerInvariant() -in '.sys', '.inf', '.cat' })
          if ($unsafe.Count -gt 0) { throw "Refusing to publish CI artifact containing driver installation files" }
          New-Item -ItemType Directory -Force -Path 'diagnostic-preview' | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination 'diagnostic-preview'
          Copy-Item -LiteralPath 'docs/DIAGNOSTIC_WINDOWS_PREVIEW.md' -Destination 'diagnostic-preview/README.md'
          $copy = Join-Path 'diagnostic-preview' $setups[0].Name
          $digest = (Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($setups[0].Name)" | Set-Content -Encoding utf8 -Path 'diagnostic-preview/SHA256SUMS.txt'
          "Commit: $env:GITHUB_SHA" | Set-Content -Encoding utf8 -Path 'diagnostic-preview/BUILD_ORIGIN.txt'
          "Development preview only; unsigned; no virtual Xbox/XInput functionality." |
            Add-Content -Encoding utf8 -Path 'diagnostic-preview/BUILD_ORIGIN.txt'

      - name: Upload short-lived diagnostic test artifact (NOT a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: PadBridge-Diagnostic-NSIS-Preview-x64
          path: diagnostic-preview/
          if-no-files-found: error
          retention-days: 3
